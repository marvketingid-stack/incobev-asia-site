<!-- Shared header / sticky nav (single source — assembled into every page).
     Pattern (per client comments, ref: wmf-coffeemachines.com): centered logo,
     no inline category links, hamburger opens a dark full-screen nav overlay. -->
<header id="site-header" class="sticky top-0 z-50 border-b border-outline-variant bg-surface/90 shadow-sm backdrop-blur-md transition-all duration-300">
  <div class="container-page flex h-20 items-center justify-between transition-all duration-300" id="nav-bar">
    <!-- left spacer keeps the logo optically centered opposite the hamburger -->
    <div class="h-11 w-11 shrink-0"></div>
    <!-- Centered logo -->
    <a href="index.html" class="flex items-center" aria-label="IncoBev Asia — home">
      <img src="assets/logos/incobev-logo.png" alt="IncoBev Asia" width="292" height="70" class="h-8 w-auto sm:h-9">
    </a>
    <!-- Hamburger -->
    <button id="nav-toggle" type="button"
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg text-primary transition-colors hover:bg-primary/5"
      aria-label="Open menu" aria-controls="nav-panel" aria-expanded="false">
      <span class="material-symbols-outlined text-[28px]">menu</span>
    </button>
  </div>
</header>

<!-- Full-screen dark navigation overlay -->
<div id="nav-panel" class="fixed inset-0 z-[70] hidden flex-col bg-inverse-surface text-surface-bright">
  <div class="container-page flex h-20 shrink-0 items-center justify-between border-b border-white/10">
    <div class="h-11 w-11"></div>
    <a href="index.html" class="flex items-center" aria-label="IncoBev Asia — home">
      <img src="assets/logos/incobev-logo-white.png" alt="IncoBev Asia" width="292" height="70" class="h-8 w-auto sm:h-9">
    </a>
    <button id="nav-close" type="button"
      class="flex h-11 w-11 items-center justify-center rounded-lg text-surface-bright transition-colors hover:bg-white/10"
      aria-label="Close menu">
      <span class="material-symbols-outlined text-[28px]">close</span>
    </button>
  </div>
  <nav class="container-page flex flex-1 flex-col justify-center gap-1 overflow-y-auto py-8" aria-label="Primary">
    <a href="index.html" class="{{PNAV_home}}"><span>Home</span><span class="material-symbols-outlined text-[28px] opacity-40 transition group-hover:translate-x-1 group-hover:opacity-100">arrow_forward</span></a>
    <a href="about-us.html" class="{{PNAV_about}}"><span>About Us</span><span class="material-symbols-outlined text-[28px] opacity-40 transition group-hover:translate-x-1 group-hover:opacity-100">arrow_forward</span></a>
    <a href="our-brands.html" class="{{PNAV_brands}}"><span>Our Brands</span><span class="material-symbols-outlined text-[28px] opacity-40 transition group-hover:translate-x-1 group-hover:opacity-100">arrow_forward</span></a>
    <a href="solutions.html" class="{{PNAV_solutions}}"><span>Solutions</span><span class="material-symbols-outlined text-[28px] opacity-40 transition group-hover:translate-x-1 group-hover:opacity-100">arrow_forward</span></a>
    <a href="sustainability.html" class="{{PNAV_sustainability}}"><span>Sustainability</span><span class="material-symbols-outlined text-[28px] opacity-40 transition group-hover:translate-x-1 group-hover:opacity-100">arrow_forward</span></a>
    <a href="contact-us.html" class="{{PNAV_contact}}"><span>Contact</span><span class="material-symbols-outlined text-[28px] opacity-40 transition group-hover:translate-x-1 group-hover:opacity-100">arrow_forward</span></a>
  </nav>
</div>
